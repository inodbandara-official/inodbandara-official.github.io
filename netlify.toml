# Clean case-study URLs. status = 200 is a rewrite (serves the shared template,
# keeps the pretty URL); 301 is a real redirect. First match wins, so the
# trailing-slash rule sits above the splat.

[[redirects]]
  from = "/work/"
  to = "/work"
  status = 301

[[redirects]]
  from = "/work/*"
  to = "/project.html"
  status = 200
